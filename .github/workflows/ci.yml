name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build, and E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH_SECRET: ci-test-secret-change-me
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chatbot_test
      PLAYWRIGHT: "True"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/about-and-runtime'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes to commit."
            exit 0
          fi
          git commit -m "security: regenerate dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Dependency security audit
        run: pnpm audit --prod --audit-level high

      - name: Static checks
        run: pnpm check

      - name: Database migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
